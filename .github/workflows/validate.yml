name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Validate the sample and the gold pairs
        run: python scripts/validate.py --data sample --sample
      - name: Gold results are up to date
        run: |
          python scripts/evaluate_gold.py
          git diff --exit-code -- docs/gold-results.md
